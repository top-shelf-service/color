name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck nano

      - name: "Workflow: validate own YAML"
        run: python3 -c "import yaml; yaml.safe_load(open('.github/workflows/main.yaml'))"

      - name: "Repo: entrypoints must be executable in git"
        run: |
          fail=0
          for f in install.sh uninstall.sh validate_color_roles.sh \
                   ctl_environment_template/install_hook.sh.template; do
            mode=$(git ls-files -s "$f" | awk '{print $1}')
            if [ "$mode" != "100755" ]; then
              echo "::error file=$f::committed mode ${mode:-missing}, expected 100755"
              fail=1
            fi
          done
          exit $fail

      - name: "Lint: shellcheck"
        run: |
          shellcheck $(git ls-files '*.sh') \
                     ctl_environment_template/install_hook.sh.template \
                     ctl_environment_template/colors.source.sh.template

      - name: "Lint: JSON templates"
        run: |
          for f in $(git ls-files '*.json.template'); do
            jq -e . "$f" >/dev/null || { echo "::error file=$f::invalid JSON"; exit 1; }
          done

      - name: "Policy: shipped palette obeys color-laws.json"
        run: |
          ./validate_color_roles.sh \
            ctl_environment_template/color_roles.json.template \
            ctl_environment_template/laws/color/color-laws.json.template

      - name: "Policy: every law rejects a violating schema"
        run: |
          R=ctl_environment_template/color_roles.json.template
          L=ctl_environment_template/laws/color/color-laws.json.template
          fail=0
          check() {
            tmp=$(mktemp --suffix=.json)
            jq "$2" "$R" > "$tmp"
            if ./validate_color_roles.sh --quiet "$tmp" "$L" >/dev/null 2>&1; then
              echo "::error::law not enforced: $1"; fail=1
            else
              echo "ok: $1 rejected"
            fi
            rm -f "$tmp"
          }
          check "pure white"            '.[0].hex_value="#FFFFFF"'
          check "pure black"            '.[0].hex_value="#000000"'
          check "too dark"              '.[0].hex_value="#0A0A0A"'
          check "too bright"            '.[0].hex_value="#FAFAFA"'
          check "malformed hex"         '.[0].hex_value="#GGG"'
          check "duplicate role"        '. + [.[0]]'
          check "missing required role" 'map(select(.role!="prompt"))'
          check "missing field"         '.[0] |= del(.hierarchy)'
          check "bad hierarchy"         '.[0].hierarchy="wizard"'
          exit $fail

      - name: "Install: idempotent, and re-runs do not grow .bashrc"
        run: |
          (
            export HOME=$(mktemp -d)
            ./install.sh
            a=$(wc -l < "$HOME/.bashrc")
            ./install.sh
            ./install.sh
            [ "$a" = "$(wc -l < "$HOME/.bashrc")" ] || { echo "::error::.bashrc grew on re-run"; exit 1; }
          )

      - name: "Contract: loader is self-locating (no compat symlink)"
        run: |
          (
            export HOME=$(mktemp -d)
            ./install.sh >/dev/null
            rm -f "$HOME/ctl_environment" "$HOME/.color_roles.json"
            unset COLOR_RUNTIME_HOME
            . "$HOME/.local/share/tss/color/colors.source.sh"
            [ "$COLOR_SYSTEM_READY" = 1 ] || { echo "::error::loader failed without symlink"; exit 1; }
            get_color_by_role prompt
            color_apply success "loader OK"
          )

      - name: "Contract: runtime survives relocation"
        run: |
          (
            export HOME=$(mktemp -d)
            ./install.sh >/dev/null
            mv "$HOME/.local/share/tss/color" "$HOME/moved"
            unset COLOR_RUNTIME_HOME
            . "$HOME/moved/colors.source.sh"
            [ "$COLOR_SYSTEM_READY" = 1 ] || { echo "::error::loader failed after relocation"; exit 1; }
          )

      - name: "Enforcement: hook rejects illegal colour, keeps schema intact"
        run: |
          (
            export HOME=$(mktemp -d)
            ./install.sh >/dev/null
            RT="$HOME/.local/share/tss/color"
            cp "$RT/color_roles.json" "$HOME/before"
            if "$RT/install_hook.sh" bad infra parent --hex '#FFFFFF' >/dev/null 2>&1; then
              echo "::error::hook accepted pure white"; exit 1
            fi
            cmp -s "$HOME/before" "$RT/color_roles.json" || { echo "::error::schema mutated on rejection"; exit 1; }
            "$RT/install_hook.sh" myapp deployment child
            "$RT/validate_color_roles.sh" "$RT/color_roles.json" "$RT/laws/color/color-laws.json"
          )

      - name: "Enforcement: custom roles survive reinstall"
        run: |
          (
            export HOME=$(mktemp -d)
            ./install.sh >/dev/null
            RT="$HOME/.local/share/tss/color"
            "$RT/install_hook.sh" myapp deployment child >/dev/null
            ./install.sh >/dev/null
            [ "$(jq -r 'any(.[]; .role == "myapp")' "$RT/color_roles.json")" = true ] \
              || { echo "::error::reinstall destroyed a registered role"; exit 1; }
          )

      - name: "Uninstall: leaves nothing behind, install works after"
        run: |
          (
            export HOME=$(mktemp -d)
            printf 'export KEEPME=1\n' > "$HOME/.bashrc"
            ./install.sh >/dev/null
            ./uninstall.sh -y >/dev/null
            [ -d "$HOME/.local/share/tss/color" ] && { echo "::error::runtime orphaned"; exit 1; }
            grep -q COLOR_RUNTIME_HOME "$HOME/.bashrc" && { echo "::error::.bashrc not cleaned"; exit 1; }
            grep -q KEEPME "$HOME/.bashrc" || { echo "::error::unmanaged .bashrc line destroyed"; exit 1; }
            ./install.sh >/dev/null
          )

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t color-module-env .
      - name: Smoke test inside the image
        run: |
          docker run --rm color-module-env bash -lc '
            [ "$COLOR_SYSTEM_READY" = 1 ] || exit 1
            color_apply success "container OK"
            color_validate'
